name: multi-agent-pollution-defense

services:
  backend:
    build: ./backend
    pull_policy: if_not_present
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - LLM_ENABLED=false
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    restart: unless-stopped
